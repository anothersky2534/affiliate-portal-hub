<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiliate Portal Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

  <div class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between pb-6 border-b border-gray-200 gap-4 mb-6">
      <div>
        <h1 class="text-xl font-bold text-gray-900">Affiliate Portal Hub</h1>
        <p class="text-xs text-gray-500 mt-0.5">複数サイトの更新状況・記事数管理</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="last-sync-time" class="text-xs text-gray-500">同期中...</span>
        <button id="btn-refresh" class="px-3 py-1.5 text-xs font-medium text-gray-700 bg-white border border-gray-300 rounded hover:bg-gray-50 transition">
          更新
        </button>
        <button onclick="openAddModal()" class="px-3 py-1.5 text-xs font-medium text-white bg-gray-900 rounded hover:bg-gray-800 transition">
          + サイト追加
        </button>
      </div>
    </header>

    <!-- Summary Metrics -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
      <div class="bg-white p-4 rounded border border-gray-200 shadow-sm">
        <div class="text-xs text-gray-500 font-medium">監視サイト数</div>
        <div class="text-2xl font-bold text-gray-900 mt-1" id="stat-total-sites">--</div>
      </div>
      <div class="bg-white p-4 rounded border border-gray-200 shadow-sm">
        <div class="text-xs text-gray-500 font-medium">正常稼働</div>
        <div class="text-2xl font-bold text-green-600 mt-1" id="stat-active-sites">--</div>
      </div>
      <div class="bg-white p-4 rounded border border-gray-200 shadow-sm">
        <div class="text-xs text-gray-500 font-medium">全登録記事数</div>
        <div class="text-2xl font-bold text-gray-900 mt-1" id="stat-total-items">--</div>
      </div>
      <div class="bg-white p-4 rounded border border-gray-200 shadow-sm">
        <div class="text-xs text-gray-500 font-medium">本日新着</div>
        <div class="text-2xl font-bold text-gray-900 mt-1" id="stat-today-new">--</div>
      </div>
    </section>

    <!-- ASP Links (Simple text shortcuts) -->
    <div class="flex flex-wrap items-center gap-2 pb-6 text-xs text-gray-600">
      <span class="font-medium text-gray-700">管理画面リンク:</span>
      <a href="https://affiliate.duga.jp/" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 bg-white border border-gray-200 rounded hover:border-gray-400 transition">DUGA</a>
      <a href="https://affiliate.dmm.com/" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 bg-white border border-gray-200 rounded hover:border-gray-400 transition">FANZA/DMM</a>
      <a href="https://search.google.com/search-console" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 bg-white border border-gray-200 rounded hover:border-gray-400 transition">Search Console</a>
      <a href="https://analytics.google.com/" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 bg-white border border-gray-200 rounded hover:border-gray-400 transition">Analytics</a>
    </div>

    <!-- Sites Table -->
    <section class="bg-white rounded border border-gray-200 shadow-sm overflow-hidden mb-8">
      <div class="p-4 border-b border-gray-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-gray-50/50">
        <h2 class="text-sm font-bold text-gray-900">監視サイト一覧</h2>
        <input type="text" id="search-input" placeholder="サイト名で検索..." class="text-xs border border-gray-300 rounded px-3 py-1.5 w-full sm:w-64 bg-white focus:outline-none focus:border-gray-500">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-gray-700">
          <thead class="bg-gray-50 text-gray-500 font-semibold border-b border-gray-200">
            <tr>
              <th class="px-4 py-3">状態</th>
              <th class="px-4 py-3">サイト名 / ASP</th>
              <th class="px-4 py-3">最終更新日時</th>
              <th class="px-4 py-3 text-right">総記事数</th>
              <th class="px-4 py-3 text-right">新着</th>
              <th class="px-4 py-3 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="sites-table-body" class="divide-y divide-gray-100">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Footer -->
    <footer class="text-xs text-gray-400 flex items-center justify-between pt-4 border-t border-gray-200">
      <div>&copy; 2026 Affiliate Portal Hub</div>
      <div class="flex items-center gap-4">
        <button onclick="exportConfig()" class="hover:text-gray-600 transition">設定エクスポート</button>
        <label class="hover:text-gray-600 transition cursor-pointer">
          設定インポート
          <input type="file" accept=".json" class="hidden" onchange="importConfig(event)">
        </label>
      </div>
    </footer>

  </div>

  <!-- Modal -->
  <div id="site-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg border border-gray-200 shadow-xl max-w-md w-full p-6 space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-gray-200">
        <h3 id="modal-title" class="text-sm font-bold text-gray-900">サイト設定</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-lg leading-none">&times;</button>
      </div>

      <form id="site-form" class="space-y-3 text-xs">
        <input type="hidden" id="site-id">

        <div>
          <label class="block font-medium text-gray-700 mb-1">サイト名</label>
          <input type="text" id="site-name" required class="w-full border border-gray-300 rounded px-3 py-1.5 focus:outline-none focus:border-gray-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-gray-700 mb-1">ASP種別</label>
            <input type="text" id="site-asp" placeholder="例: DUGA, FANZA" class="w-full border border-gray-300 rounded px-3 py-1.5 focus:outline-none focus:border-gray-500">
          </div>
          <div>
            <label class="block font-medium text-gray-700 mb-1">カテゴリ</label>
            <input type="text" id="site-category" placeholder="例: 特化ポータル" class="w-full border border-gray-300 rounded px-3 py-1.5 focus:outline-none focus:border-gray-500">
          </div>
        </div>

        <div>
          <label class="block font-medium text-gray-700 mb-1">公開サイトURL</label>
          <input type="url" id="site-url" required placeholder="https://..." class="w-full border border-gray-300 rounded px-3 py-1.5 focus:outline-none focus:border-gray-500">
        </div>

        <div>
          <label class="block font-medium text-gray-700 mb-1">status.json URL</label>
          <input type="url" id="status-url" required placeholder="https://.../status.json" class="w-full border border-gray-300 rounded px-3 py-1.5 focus:outline-none focus:border-gray-500">
        </div>

        <div>
          <label class="block font-medium text-gray-700 mb-1">GitHub リポジトリ/Actions URL</label>
          <input type="url" id="actions-url" placeholder="https://github.com/..." class="w-full border border-gray-300 rounded px-3 py-1.5 focus:outline-none focus:border-gray-500">
        </div>

        <div class="pt-3 border-t border-gray-200 flex items-center justify-between">
          <button type="button" id="btn-delete-site" class="text-red-600 hover:underline hidden">削除</button>
          <div class="flex items-center gap-2 ml-auto">
            <button type="button" onclick="closeModal()" class="px-3 py-1.5 border border-gray-300 rounded text-gray-700 hover:bg-gray-50">キャンセル</button>
            <button type="submit" class="px-3 py-1.5 bg-gray-900 text-white rounded hover:bg-gray-800">保存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="js/sites_config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
